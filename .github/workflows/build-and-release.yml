name: Build and Release

on:
  push:
    paths:
      - 'source/**'
      - 'requirements.txt'
      - '.github/workflows/build-release.yml'
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build executable with PyInstaller
        run: |
          python -m PyInstaller --noconsole --noconfirm --add-data "source/gui/logo.ico;." --icon="source/gui/logo.ico" --name="OpenHam Logger 0.4.0" source/main.py
      
      - name: Setup Inno Setup
        run: |
          choco install innosetup -y
      
      - name: Build installer with Inno Setup
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      
      - name: Upload installer as artifact
        uses: actions/upload-artifact@v3
        with:
          name: OpenHam-Setup
          path: releases/OpenHam_Setup_*.exe
      
      - name: Create Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: releases/OpenHam_Setup_*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
